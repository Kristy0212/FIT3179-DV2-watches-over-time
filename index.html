<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <!-- Title -->
        <title>Watches Over Time</title>
        <!-- Vega-->
        <script src="https://cdn.jsdelivr.net/npm/vega@6"></script>
        <!-- Vega-Lite-->
        <script src="https://cdn.jsdelivr.net/npm/vega-lite@6"></script>
        <!-- Vega-Embed-->
        <script src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
        
        <style>
            body {
                background: #F7F3EA;
                margin: 0;
                padding: 30px;
            }
            .chart-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 30px;
                margin-bottom: 40px;
            }
            .chart{
                width:100%;
            }
            .chart-card{
                background:white;
                border-radius: 10px;
                padding: 20px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            }
            .dashboard-header{
                background: #634032;
                /*Keep existing banner image and gradient*/
                background-image: 
                linear-gradient(
                    to right,
                    rgba(99,64,50,1) 0%,
                    rgba(99,64,50,0.95) 30%,
                    rgba(99,64,50,0.65) 55%,
                    rgba(99,64,50,0.1) 100%
                ),
                url("images/bar_background_picture.png");

                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;

                color: white;
                padding: 30px 35px;
                min-height: 130px;
                margin-bottom: 30px;

                display: flex;
                flex-direction: column;
                align-items: flex-start;
                justify-content: center;
            }
            .header-text {
                max-width: 650px;
            }
            /* Dashboard Title */
            .dashboard-header h1 {
                margin: 0 0 12px 0;
                font-family: Georgia, serif;
                font-size: 42px;
                font-weight: bold;
                line-height: 1.2;
                color: #FFF8EE;
            }

            /* Dashboard Subtitle */
            .dashboard-header p {
                margin: 0;
                font-size: 18px;
                line-height: 1.6;
                max-width: 850px;
                color: #F7F0E5;
            }
            /* Navigation inside the banner */
            .header-nav {
                display: flex;
                justify-content: flex-start;
                align-items: center;
                flex-wrap: wrap;
                gap: 10px;
                margin: 16px 0 0 0;
            }   

            .header-nav a {
                display: inline-block;
                color: #634032;
                background: #F7F0E5;
                border: 1px solid #F7F0E5;
                border-radius: 5px;
                padding: 11px 16px;

                font-family: Arial, sans-serif;
                font-size: 13px;
                font-weight: 600;
                text-decoration: none;
                white-space: nowrap;

                transition: background 0.2s ease,
                            color 0.2s ease;
            }

            .header-nav a:hover {
                background: #C6A477;
                border-color: #C6A477;
                color: #38271F;
            }
            html {
                scroll-behavior: smooth;
            }
            .section-header{
                background: #EADCC8;
                padding: 14px 20px;
                margin-bottom: 20px;
            }
            .section-header h2{
                margin: 0;
                color: #634032;
                font-family: Georgia, serif;
                font-size: 24px;
            }
            @media (max-width: 768px) {
                .dashboard-header {
                    padding: 24px 20px 16px;
            }

            .header-nav {
                justify-content: flex-start;
            }

            .header-nav a {
                font-size: 12px;
                padding: 8px 10px;
            }
        }
        </style>
    </head>
    <body>
        <!-- Dashboard Header -->
        <div class="dashboard-header">
        <div class="header-text">
            <h1>Watches Over Time</h1>
            <p>
                Explore watch history, origins, materials, and value across time.
            </p>
        </div>
        <!-- Navigation Buttons -->
        <nav class="header-nav">
            <a href="#history">Watch History</a>
            <a href="#global">Global Watchmaking</a>
            <a href="#characteristics">Characteristics</a>
            <a href="#value">Design &amp; Value</a>
        </nav>
    </div>

        <!-- Section 1: Watches History -->
        <div class="section-header" id="history">
            <h2>1. Watch History</h2>
        </div>
        <div class="chart-row">
            <div class="chart-card">
                <!--Production Timeline Chart-->
                <div id="ProductionTimeline"></div>
            </div>
            <div class="chart-card">
                <!--Manufacturer Evolution Chart-->
                <div id="ManufacturerEvolution"></div>
            </div>
        </div>

        <!-- Section 2: Global Watchmaking -->
        <div class="section-header" id="global">
            <h2>2. Global Watchmaking</h2>
        </div>
        <div class="chart-card">
            <!--Global Origins of Watch Manufacturers-->
            <div id="GlobalOrigins"></div>
        </div>
        <div class="chart-card">
            <!--The Global Spread of Watchmaking-->
            <div id="GlobalSpread"></div>
        </div>
        <div class="chart-card">
            <div id="CurrentWatchBrands"></div>
        </div>

        <!-- Section 3: Watch Characteristics -->
        <div class="section-header" id="characteristics">
            <h2>3. Watch Characteristics</h2>
        </div>
        <div class="chart-row">
            <div class="chart-card">
                <!--Watch Production Across Period-->
                <div id="WatchProductionAcrossPeriod"></div>
            </div>
            <div class="chart-card">
                <!--WatchSizeDistribution-->
                <div id="WatchSizeDistribution"></div>
            </div>
        </div>
        <div class="chart-card">
            <!--Case Material By Manufacturer-->
            <div id="CaseMaterial"></div>
        </div>
        
        <!-- Section 4: Design and Value -->
        <div class="section-header" id="value">
            <h2>4. Design and Value</h2>
        </div>
        <div class="chart-row">
            <div class="chart-card">
                <!--Watch Production Across Period-->
                <div id="PriceEvolution"></div>
            </div>
            <div class="chart-card">
                <!--Manufacturer Price Comparison-->
                <div id="ManufacturerPrice"></div>
            </div>
        </div>
        <div class="chart-card">
            <!--BraceletMaterial-->
            <div id="BraceletMaterial"></div>
        </div>

        <!--Load Chart-->
        <script>
            // Section 1: Watches History
            vegaEmbed('#ProductionTimeline', 'Chart/productionTimeline.json');
            vegaEmbed('#ManufacturerEvolution', 'Chart/manufacturerEvolution.json');
            // Section 2: Global WatchMakings
            vegaEmbed('#GlobalOrigins', 'Chart/globalOriginsofWatchManufacturers.json');
            vegaEmbed('#GlobalSpread', 'Chart/globalSpreadofWatchMaking.json');
            vegaEmbed('#CurrentWatchBrands','Chart/currentWatchBrandsWorldwide.json');
            // Section 3: Watch Characteristics
            vegaEmbed('#WatchProductionAcrossPeriod', 'Chart/manufacturerProductionPeriod.json');
            vegaEmbed('#WatchSizeDistribution', 'Chart/watchSizeDistribution.json');
            vegaEmbed('#CaseMaterial', 'Chart/caseMaterialByManufacturer.json');
            // Section 4: Design and Values 
            vegaEmbed('#PriceEvolution', 'Chart/priceEvolution.json');
            vegaEmbed('#ManufacturerPrice', 'Chart/manufacturerPriceComparison.json');
            vegaEmbed('#BraceletMaterial', 'Chart/manufacturerBraceletMaterial.json');
        </script>
    </body>

</html>
